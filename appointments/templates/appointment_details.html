{% extends 'base.html' %}

{% block content %}
<!-- header -->
<div class="d-flex justify-content-between align-items-center">
    <h2 class="mb-3">Appointment Details</h2>
    <div>
        <a href="{% url 'edit_appointment' appointment.id %}"
            class="btn btn-outline-primary">
            Edit
        </a>

        <a href="{% url 'delete_appointment' appointment.id %}"
            class="btn btn-outline-danger">
            Delete
        </a>
    </div>
</div>
<span class="badge {% if appointment.status == 'scheduled' %}bg-secondary{% elif appointment.status == 'completed' %}bg-success{% else %}bg-danger{% endif %}">{{ appointment.status }}</span>
<div class="mb-3"></div>

<!-- appointment details -->
<p><strong>Patient:</strong> <a class="link-primary link-underline-opacity-" href="{% url 'patient_details' appointment.patient.id %}">{{ appointment.patient.name }}</a></p>
<p><strong>Date:</strong> {{ appointment.date }}</p>
<p><strong>Time:</strong> {{ appointment.time }}</p>
<p><strong>Reason:</strong> {{ appointment.reason }}</p>
<p><strong>Notes:</strong> {{ appointment.notes }}</p>
{% endblock %}
