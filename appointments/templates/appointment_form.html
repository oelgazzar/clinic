<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Appointment</title>
</head>
<body>
    <h1>{{ button_text }}</h1>
    <form method="post">
        {% csrf_token %}
        <label for="patient">Patient:</label>
        <select id="patient" name="patient" required>
            <option value="">Select a patient</option>
            {% for patient in patients %}
                <option value="{{ patient.id }}" {% if appointment.patient.id == patient.id %}selected{% endif %}>{{ patient.name }}</option>
            {% endfor %}
        </select>
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ appointment.date|date:'Y-m-d' }}" required>
        <br>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" value="{{ appointment.time|time:'H:i' }}" required>
        <br>
        <label for="reason">Reason:</label>
        <input type="text" id="reason" name="reason" value="{{ appointment.reason }}" placeholder="Reason for appointment">
        <br>
        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes" placeholder="Additional notes">{{ appointment.notes }}</textarea>
        <br>
        <button type="submit">{{ button_text }}</button>
    </form>
</body>
</html>
