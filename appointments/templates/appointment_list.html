{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Appointments</h2>
    <a class="btn btn-primary btn-sm" href="{% url 'new_appointment' %}">New Appointment</a>
</div>
<form class="w-25">
    <div class="input-group">
        <input class="form-control" type="search" name="q" placeholder="Search by patient name" value="{{ request.GET.q }}">
        <button class="btn btn-primary btn-sm" type="submit">Search</button>
    </div>
</form>
<p>Filter By Date:</p>
<form method="get" action="">
    <label for="from_date">From:</label>
    <input type="date" id="from_date" name="from_date" value="{{ request.GET.from_date }}">
    <label for="to_date">To:</label>
    <input type="date" id="to_date" name="to_date" value="{{ request.GET.to_date }}">
    <button type="submit">Filter</button>
</form>
<ul>
    {% for appointment in appointments %}
        <li><a href="{% url 'appointment_details' appointment.id %}">{{ appointment.date }} - {{ appointment.patient.name }}</a></li>
    {% empty %}
            <li>No appointments available.</li>
    {% endfor %}
</ul>
{% endblock %}
