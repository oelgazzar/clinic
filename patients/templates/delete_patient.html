{% extends 'base.html' %}

{% block content %}
    <h1>Delete Patient</h1>
    <p>Are you sure you want to delete this patient?</p>
    <p class="fw-bold">{{ patient.name }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger btn-sm" type="submit">Yes, Delete</button>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'patient_list' %}">Cancel</a>
    </form>
{% endblock %}
