{% extends 'base.html' %}

{% block content %}
    <h1>Delete Patient</h1>
    <p>Are you sure you want to delete this patient?</p>
    <p><strong>Name:</strong> {{ patient.name }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'patient_list' %}">Cancel</a>
    </form>
{% endblock %}
