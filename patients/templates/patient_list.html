{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between">
    <h2>Patients list</h2>
    <a class="btn btn-primary btn-sm" href="{% url 'new_patient' %}">New Patient <span class="fs-4">+</span></a>
</div>
<div class="d-flex justify-content-center">
    <form class="w-50" method="get" action="">
        <div class="input-group my-3">
            <input class="form-control" type="search" name="q" placeholder="Search patients..." value="{{ request.GET.q }}">
            <button class="btn btn-outline-secondary" type="submit">Search</button>
        </div>
    </form>
</div>
<div class="bg-light rounded p-3 mt-2 mb-2 mx-4">
    <h3 class="fs-5 mb-3">All patients</h3>
    <table class="table">
        <thead>
            <tr class="table-primary">
                <th>Name</th>
                <th>Date of Birth</th>
                <th>Phone Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for patient in patients %}
                <tr>
                    <td>{{ patient.name }}</td>
                    <td>{{ patient.age }}</td>
                    <td>{{ patient.phone }}</td>
                    <td>
                        <a class="btn btn-sm btn-primary" href="{% url 'patient_details' patient.id %}">View</a>
                        <a class="btn btn-sm btn-secondary" href="{% url 'edit_patient' patient.id %}">Edit</a>
                        <a class="btn btn-sm btn-danger" href="{% url 'delete_patient' patient.id %}">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No patients found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
